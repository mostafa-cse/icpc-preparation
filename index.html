<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICPC Final Sprint — 26-Week Training Program</title>
  <meta http-equiv="refresh" content="0; url=frontend/">
  <link rel="canonical" href="frontend/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    // Preserve URL search params and hash routes (e.g. #checklist/0, #dashboard)
    var target = "frontend/" + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(14, 20, 29, 0.88);
      --card-border: rgba(255, 107, 0, 0.28);
      --fire-orange: #ff5722;
      --fire-amber: #ff9800;
      --fire-gold: #ffca28;
      --fire-cyan: #00e5ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(ellipse 70% 50% at 50% 45%, rgba(255, 77, 0, 0.16), transparent 75%),
        radial-gradient(circle at 50% 50%, rgba(255, 152, 0, 0.08), transparent 50%),
        linear-gradient(180deg, #05070a 0%, #0a0e16 100%);
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .flame-ambient-radiance {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, rgba(255, 87, 34, 0.22) 0%, rgba(255, 152, 0, 0.08) 45%, transparent 70%);
      border-radius: 50%;
      filter: blur(48px);
      pointer-events: none;
      animation: ambientPulse 2.4s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    .redirect-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem 2.2rem 2.2rem;
      max-width: 420px;
      width: 90%;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.75),
        0 0 45px rgba(255, 87, 34, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      z-index: 2;
    }

    .flame-wrapper {
      position: relative;
      width: 120px;
      height: 140px;
      margin: 0 auto 1.4rem;
    }

    .flame-glow-ground {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 22px;
      background: radial-gradient(ellipse at center, rgba(255, 100, 0, 0.5) 0%, rgba(255, 60, 0, 0.2) 50%, transparent 80%);
      border-radius: 50%;
      filter: blur(4px);
      animation: groundGlowPulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes groundGlowPulse {
      0% { opacity: 0.6; transform: translateX(-50%) scaleX(0.9); }
      100% { opacity: 1; transform: translateX(-50%) scaleX(1.15); }
    }

    .flame-base {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 125px;
    }

    .flame-tongue.outer {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 74px;
      height: 105px;
      background: radial-gradient(ellipse at 50% 85%, #ff5722 0%, #ff3d00 45%, #dd2c00 70%, transparent 95%);
      border-radius: 50% 50% 35% 35% / 65% 65% 35% 35%;
      filter: drop-shadow(0 0 16px rgba(255, 61, 0, 0.85)) drop-shadow(0 0 32px rgba(255, 110, 0, 0.45));
      animation: flameFlickerOuter 1.2s ease-in-out infinite alternate;
      transform-origin: 50% 90%;
    }

    .flame-tongue.mid {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 80px;
      background: radial-gradient(ellipse at 50% 85%, #ffca28 0%, #ffa000 50%, #ff5722 85%);
      border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
      filter: drop-shadow(0 0 12px rgba(255, 193, 7, 0.9));
      animation: flameFlickerMid 0.95s ease-in-out infinite alternate;
      transform-origin: 50% 90%;
    }

    .flame-tongue.inner {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 52px;
      background: radial-gradient(ellipse at 50% 80%, #ffffff 0%, #fff9c4 40%, #ffd54f 80%);
      border-radius: 50% 50% 25% 25% / 60% 60% 40% 40%;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.95));
      animation: flameFlickerInner 0.75s ease-in-out infinite alternate;
      transform-origin: 50% 90%;
    }

    .flame-tongue.blue-base {
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 38px;
      height: 18px;
      background: radial-gradient(ellipse at 50% 40%, #00e5ff 0%, #0288d1 60%, transparent 100%);
      border-radius: 50% 50% 40% 40%;
      filter: drop-shadow(0 0 8px #00e5ff);
      opacity: 0.9;
      animation: blueBasePulse 1.1s ease-in-out infinite alternate;
    }

    @keyframes blueBasePulse {
      0% { transform: translateX(-50%) scale(0.95); opacity: 0.8; }
      100% { transform: translateX(-50%) scale(1.08); opacity: 1; }
    }

    .flame-code-mark {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 900;
      color: #1a0800;
      text-shadow: 0 0 4px #ffffff, 0 0 8px #ffb300, 0 0 14px #ff5722;
      z-index: 5;
      pointer-events: none;
      animation: codePulse 1.1s ease-in-out infinite alternate;
      letter-spacing: -1.5px;
    }

    @keyframes codePulse {
      0% { transform: translateX(-50%) scale(0.96); filter: brightness(0.95); }
      100% { transform: translateX(-50%) scale(1.08); filter: brightness(1.2); }
    }

    .flame-sparks {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .flame-spark {
      position: absolute;
      bottom: 24px;
      width: 5px;
      height: 5px;
      background: #fff8e1;
      border-radius: 50%;
      box-shadow: 0 0 6px #ffb300, 0 0 12px #ff5722;
      opacity: 0;
      animation: riseEmber 1.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }

    @keyframes flameFlickerOuter {
      0% { transform: translateX(-50%) scale(1) rotate(-1.5deg); }
      50% { transform: translateX(-50%) scaleX(1.05) scaleY(0.96) rotate(1.2deg); }
      100% { transform: translateX(-50%) scaleX(0.97) scaleY(1.04) rotate(1.8deg); }
    }

    @keyframes flameFlickerMid {
      0% { transform: translateX(-50%) scale(1) rotate(1deg); }
      50% { transform: translateX(-50%) scaleX(1.07) scaleY(0.94) rotate(-1.5deg); }
      100% { transform: translateX(-50%) scaleX(0.93) scaleY(1.06) rotate(1.2deg); }
    }

    @keyframes flameFlickerInner {
      0% { transform: translateX(-50%) scale(1) translateY(0); opacity: 0.92; }
      50% { transform: translateX(-50%) scaleX(0.91) scaleY(1.1) translateY(-2px); opacity: 1; }
      100% { transform: translateX(-50%) scaleX(1.09) scaleY(0.93) translateY(1px); opacity: 0.9; }
    }

    @keyframes riseEmber {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      20% { opacity: 1; transform: translate(calc(var(--dx, 0px) * 0.3), -26px) scale(1); }
      75% { opacity: 0.85; }
      100% { transform: translate(var(--dx, 0px), -120px) scale(0.15); opacity: 0; }
    }

    .flame-badge {
      font-family: 'Oswald', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
      color: #ff9800;
      background: rgba(255, 152, 0, 0.1);
      border: 1px solid rgba(255, 152, 0, 0.35);
      border-radius: 999px;
      padding: 0.22rem 0.8rem;
      margin-bottom: 0.65rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 0 12px rgba(255, 152, 0, 0.2);
    }

    .flame-title {
      font-family: 'Oswald', sans-serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 0 0 0.45rem;
      background: linear-gradient(90deg, #fff3e0 0%, #ffb74d 30%, #ff7043 65%, #ffb74d 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: flameTextShimmer 3s linear infinite;
    }

    @keyframes flameTextShimmer {
      to { background-position: 200% center; }
    }

    .flame-ticker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: #ffcc80;
      margin: 0 0 1.25rem;
      min-height: 1.25rem;
      opacity: 0.9;
      letter-spacing: 0.02em;
    }

    .flame-progress-track {
      width: 210px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin: 0 auto 1.25rem;
    }

    .flame-progress-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent 0%, #ff9800 50%, #ff5722 80%, #ffffff 100%);
      border-radius: 999px;
      animation: flameProgress 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      box-shadow: 0 0 10px #ff9800;
    }

    @keyframes flameProgress {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    p.redirect-fallback {
      font-size: 0.8rem;
      color: #8b949e;
      margin: 0;
    }

    a {
      color: #ff9800;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="flame-ambient-radiance" aria-hidden="true"></div>
  <div class="redirect-card">
    <div class="flame-wrapper">
      <div class="flame-glow-ground" aria-hidden="true"></div>
      <div class="flame-base">
        <div class="flame-tongue outer"></div>
        <div class="flame-tongue mid"></div>
        <div class="flame-tongue inner"></div>
        <div class="flame-tongue blue-base"></div>
        <div class="flame-code-mark">&lt;/&gt;</div>
      </div>
      <div class="flame-sparks" aria-hidden="true">
        <span class="flame-spark" style="--dx: -16px; left: 44%; animation-delay: 0.1s;"></span>
        <span class="flame-spark" style="--dx: 14px; left: 53%; animation-delay: 0.4s;"></span>
        <span class="flame-spark" style="--dx: -8px; left: 47%; animation-delay: 0.75s;"></span>
        <span class="flame-spark" style="--dx: 20px; left: 56%; animation-delay: 1.1s;"></span>
      </div>
    </div>
    <div class="flame-badge">🔥 ICPC FINAL SPRINT</div>
    <h1 class="flame-title">IGNITING WORKSPACE</h1>
    <p class="flame-ticker">Compiling algorithmic training sets...</p>
    <div class="flame-progress-track" aria-hidden="true">
      <div class="flame-progress-bar"></div>
    </div>
    <p class="redirect-fallback"><small>Directing to ICPC preparation hub... <a href="frontend/">Enter now &rarr;</a></small></p>
  </div>
</body>
</html>
