<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICPC Final Sprint — 26-Week Training Program</title>
  <meta http-equiv="refresh" content="0; url=frontend/">
  <link rel="canonical" href="frontend/">
  <script>
    // Preserve URL search params and hash routes (e.g. #checklist/0, #dashboard)
    var target = "frontend/" + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090d12;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .redirect-card {
      background: #111822;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(249, 115, 22, 0.2);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.15rem; margin: 0 0 0.5rem; font-weight: 600; }
    p { font-size: 0.88rem; color: #8b949e; margin: 0 0 1rem; }
    a { color: #f97316; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>ICPC Final Sprint</h1>
    <p>Opening application workspace...</p>
    <p><small>If you are not redirected automatically, <a href="frontend/">click here to continue</a>.</small></p>
  </div>
</body>
</html>
